    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0a1a0a;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #gameContainer {
            position: relative;
            width: 100%; height: 100%;
            display: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #ui {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
            right: max(20px, env(safe-area-inset-right));
            display: flex; justify-content: space-between;
            font-size: 22px; color: #fff;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
            font-weight: 600; z-index: 10; pointer-events: none;
        }
        #gameOver {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20,20,25,0.9);
            backdrop-filter: blur(20px);
            color: #fff; padding: 30px 40px; border-radius: 24px;
            text-align: center; font-size: 28px;
            display: none; flex-direction: column; gap: 20px;
            z-index: 20; max-width: 85vw;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        #gameOver.active { display: flex; }
        .btn {
            background: #ffd966; border: none; padding: 14px 30px;
            border-radius: 40px; font-weight: 700; font-size: 20px;
            color: #2d2d2d; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,215,0,0.3);
            transition: all 0.15s ease; letter-spacing: 0.5px;
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        #splash1, #splash2 {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; pointer-events: none;
        }
        #splash1 { background: #0d0d15; opacity: 1; transition: opacity 0.6s ease; }
        #splash1.hidden { opacity: 0; }
        #splash1 .logo {
            font-size: 22px; font-weight: 500;
            letter-spacing: 3px; color: rgba(255,255,255,0.8);
            margin-bottom: 8px; animation: fadeInDown 0.8s ease;
            text-transform: uppercase;
        }
        #splash1 .sub {
            font-size: 13px; color: rgba(255,255,255,0.45);
            font-weight: 400; letter-spacing: 5px;
            animation: fadeInUp 0.8s ease; text-transform: uppercase;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #splash2 { background: #162816; opacity: 0; display: none; }
        #splash2.show { display: flex; opacity: 1; transition: opacity 0.6s ease; }
        #splash2 .title {
            font-size: 48px; font-weight: 800; color: #ffe9a7;
            letter-spacing: 2px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center; line-height: 1.15; padding: 0 20px;
            text-shadow: 0 2px 10px rgba(255,215,0,0.3);
        }
        @keyframes popIn {
            from { transform: scale(0.3); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
<div id="splash1"><div class="logo">Made by</div><div class="sub">Nikita Kurbatov</div></div>
<div id="splash2"><div class="title">Медвежонок<br>Саня</div></div>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <span>🍯 <span id="scoreDisplay">0</span></span>
        <span>❤️ <span id="livesDisplay">3</span></span>
    </div>
    <div id="gameOver">
        <div style="font-size:30px;font-weight:700;">Игра окончена</div>
        <div style="font-size:20px;color:#ffe9a7;">Собрано мёда: <span id="finalScore" style="font-size:26px;font-weight:700;">0</span></div>
        <button class="btn" id="restartBtn">Играть снова</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/kontra@10.0.0/kontra.min.js"></script>
<script>
(function() {
    // Заставки
    const splash1 = document.getElementById('splash1');
    const splash2 = document.getElementById('splash2');
    const gameContainer = document.getElementById('gameContainer');
    setTimeout(() => {
        splash1.classList.add('hidden');
        setTimeout(() => {
            splash1.style.display = 'none';
            splash2.classList.add('show');
            setTimeout(() => {
                splash2.style.opacity = '0';
                setTimeout(() => {
                    splash2.style.display = 'none';
                    gameContainer.style.display = 'block';
                    startGame();
                }, 600);
            }, 2200);
        }, 600);
    }, 2800);

    // Инициализация Kontra.js
    const { init, GameLoop, Sprite, keyPressed, collides } = kontra;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let groundLevel, bearScreenX;
    let score = 0, lives = 3, gameActive = false;
    let worldSpeed = 4.8, MAX_SPEED = 8.5;
    let cameraX = 0;
    let invincible = false, invincibleTimer = 0;
    let platforms = [], objects = [], particles = [];
    let bgMountains = [], bgTrees = [];
    let bear;

    const GAPS = {
        small:  [90, 140],
        medium: [160, 220],
        large:  [250, 320]
    };

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        groundLevel = window.innerHeight - 85;
        bearScreenX = Math.min(80, window.innerWidth * 0.13);
    }
    window.addEventListener('resize', resize); resize();

    function generateWorld() {
        platforms = []; objects = []; particles = []; bgMountains = []; bgTrees = [];
        platforms.push({ x: 0, y: groundLevel, w: window.innerWidth * 3, h: 28 });
        let lastX = window.innerWidth * 3;
        for (let i = 0; i < 70; i++) {
            const w = 140 + Math.random() * 220;
            const hVar = Math.sin(i * 0.5) * 80 + Math.cos(i * 0.35) * 50 + (Math.random() - 0.5) * 50;
            let y = groundLevel + hVar;
            y = Math.max(groundLevel - 170, Math.min(groundLevel + 60, y));
            const r = Math.random(); let gap;
            if (r < 0.5) gap = GAPS.small[0] + Math.random() * (GAPS.small[1] - GAPS.small[0]);
            else if (r < 0.8) gap = GAPS.medium[0] + Math.random() * (GAPS.medium[1] - GAPS.medium[0]);
            else gap = GAPS.large[0] + Math.random() * (GAPS.large[1] - GAPS.large[0]);
            const newX = lastX + gap;
            platforms.push({ x: newX, y, w, h: 28 });
            if (Math.random() < 0.65) {
                objects.push({
                    x: newX + w / 2,
                    y: y - 80 - Math.random() * 70,
                    collected: false,
                    bobPhase: Math.random() * Math.PI * 2,
                    sparkTimer: 0
                });
            }
            lastX = newX + w;
        }
        for (let i = 0; i < 15; i++) particles.push({
            x: Math.random() * window.innerWidth * 3,
            y: Math.random() * window.innerHeight * 0.5,
            vx: 0.2 + Math.random() * 0.4,
            size: 40 + Math.random() * 60,
            alpha: 0.25 + Math.random() * 0.4,
            type: 'cloud'
        });
        for (let i = 0; i < 14; i++) bgMountains.push({
            x: i * 500,
            height: 120 + Math.sin(i) * 60,
            width: 280 + Math.random() * 200
        });
        for (let i = 0; i < 30; i++) bgTrees.push({
            x: Math.random() * window.innerWidth * 3,
            y: groundLevel - 20,
            size: 0.8 + Math.random() * 1.2,
            type: 'spruce'
        });
    }

    function update(delta) {
        if (!gameActive) return;
        const steps = Math.min(Math.ceil(delta / 8), 5);
        const step = delta / steps;
        for (let s = 0; s < steps; s++) {
            bear.dy += 0.9 * (step / 16.67);
            bear.y += bear.dy * (step / 16.67);
            bear.x = cameraX + bearScreenX;
            bear.onGround = false;
            for (const p of platforms) {
                if (bear.x + 60 > p.x && bear.x < p.x + p.w) {
                    if (bear.y + 85 >= p.y && bear.y + 85 <= p.y + 28 && bear.dy >= 0) {
                        bear.y = p.y - 85;
                        bear.dy = 0;
                        bear.onGround = true;
                        bear.canDoubleJump = false;
                    }
                }
            }
            if (bear.y > window.innerHeight + 300) { loseLife(); return; }
            cameraX += worldSpeed * (step / 16.67);
            if (worldSpeed < MAX_SPEED) worldSpeed += 0.0003 * (step / 16.67);
            bear.x = cameraX + bearScreenX;

            const lastPlat = platforms[platforms.length - 1];
            if (lastPlat && lastPlat.x + lastPlat.w < cameraX + window.innerWidth * 4.5) {
                const i = platforms.length;
                const w = 140 + Math.random() * 220;
                const hVar = Math.sin(i * 0.5) * 80 + Math.cos(i * 0.35) * 50 + (Math.random() - 0.5) * 50;
                let y = groundLevel + hVar;
                y = Math.max(groundLevel - 170, Math.min(groundLevel + 60, y));
                const r = Math.random(); let gap;
                if (r < 0.5) gap = GAPS.small[0] + Math.random() * (GAPS.small[1] - GAPS.small[0]);
                else if (r < 0.8) gap = GAPS.medium[0] + Math.random() * (GAPS.medium[1] - GAPS.medium[0]);
                else gap = GAPS.large[0] + Math.random() * (GAPS.large[1] - GAPS.large[0]);
                const newX = lastPlat.x + lastPlat.w + gap;
                platforms.push({ x: newX, y, w, h: 28 });
                if (Math.random() < 0.65) objects.push({
                    x: newX + w / 2,
                    y: y - 80 - Math.random() * 70,
                    collected: false,
                    bobPhase: Math.random() * Math.PI * 2,
                    sparkTimer: 0
                });
                while (platforms.length > 50) platforms.shift();
                while (objects.length > 60) objects.shift();
            }

            for (const obj of objects) {
                if (obj.collected) continue;
                const dx = Math.abs(bear.x + 35 - obj.x);
                const dy = Math.abs(bear.y + 40 - obj.y);
                if (dx < 40 && dy < 40 && !invincible) {
                    obj.collected = true;
                    score += 25;
                    document.getElementById('scoreDisplay').textContent = score;
                    obj.sparkTimer = 1;
                    for (let j = 0; j < 6; j++) particles.push({
                        x: obj.x, y: obj.y,
                        vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3 - 1,
                        life: 1, decay: 0.04, size: 2 + Math.random() * 4,
                        color: '#ffd700', type: 'sparkle'
                    });
                }
                obj.bobPhase += 0.05 * (step / 16.67);
            }
            objects = objects.filter(o => !o.collected || o.sparkTimer > 0);
            objects.forEach(o => { if (o.sparkTimer > 0) o.sparkTimer -= 0.02; });
            objects = objects.filter(o => !o.collected || o.sparkTimer > 0);

            particles.forEach(p => {
                if (p.type === 'cloud') { p.x -= p.vx; if (p.x < -200) p.x = window.innerWidth + 300; }
                else { p.x += p.vx; p.y += p.vy; p.life -= p.decay; }
            });
            particles = particles.filter(p => p.type !== 'sparkle' || p.life > 0);

            if (invincible) { invincibleTimer--; if (invincibleTimer <= 0) invincible = false; }
        }
    }

    function loseLife() {
        lives--;
        document.getElementById('livesDisplay').textContent = lives;
        if (lives <= 0) {
            gameActive = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').classList.add('active');
            return;
        }
        bear.y = groundLevel - 85;
        bear.dy = 0;
        bear.onGround = true;
        bear.canDoubleJump = false;
        invincible = true;
        invincibleTimer = 150;
        for (let i = 0; i < 15; i++) particles.push({
            x: bear.x + 35, y: bear.y + 40,
            vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6 - 2,
            life: 1, decay: 0.03, size: 3 + Math.random() * 6,
            color: Math.random() < 0.5 ? '#ff4444' : '#ff8888', type: 'sparkle'
        });
    }

    function draw() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        // Фон
        const grad = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        grad.addColorStop(0, '#0a2a5e'); grad.addColorStop(0.35, '#3a6fb5');
        grad.addColorStop(0.65, '#7ebce6'); grad.addColorStop(0.85, '#c1e1c1'); grad.addColorStop(1, '#5a8f3c');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        const sunX = window.innerWidth * 0.85, sunY = window.innerHeight * 0.2;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 180);
        sunGlow.addColorStop(0, 'rgba(255,255,200,1)'); sunGlow.addColorStop(0.3, 'rgba(255,255,200,0.6)');
        sunGlow.addColorStop(0.7, 'rgba(255,200,100,0.1)'); sunGlow.addColorStop(1, 'rgba(255,200,100,0)');
        ctx.fillStyle = sunGlow; ctx.beginPath(); ctx.arc(sunX, sunY, 180, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fffde7'; ctx.beginPath(); ctx.arc(sunX, sunY, 35, 0, Math.PI * 2); ctx.fill();

        // Горы
        bgMountains.forEach(m => {
            const x = (m.x - cameraX * 0.1) % (window.innerWidth * 2) - 400;
            const mg = ctx.createLinearGradient(0, groundLevel - m.height, 0, groundLevel + 40);
            mg.addColorStop(0, '#5a7a4a'); mg.addColorStop(1, '#3a5a2a');
            ctx.fillStyle = mg;
            ctx.beginPath(); ctx.moveTo(x - m.width / 2, groundLevel + 40);
            ctx.quadraticCurveTo(x, groundLevel - m.height, x + m.width / 2, groundLevel + 40); ctx.fill();
        });

        // Статичные ели (без тряски)
        bgTrees.forEach(t => {
            const x = (t.x - cameraX * 0.3) % (window.innerWidth * 2) - 200;
            drawSpruce(x, groundLevel - 20, t.size);
        });

        // Облака
        particles.filter(p => p.type === 'cloud').forEach(p => {
            ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
            ctx.beginPath(); const cx = p.x, cy = p.y, s = p.size;
            ctx.arc(cx, cy, s * 0.55, 0, Math.PI * 2); ctx.arc(cx + s * 0.4, cy - s * 0.15, s * 0.45, 0, Math.PI * 2);
            ctx.arc(cx + s * 0.8, cy + s * 0.05, s * 0.5, 0, Math.PI * 2); ctx.arc(cx + s * 0.3, cy - s * 0.35, s * 0.4, 0, Math.PI * 2); ctx.fill();
        });

        // Платформы
        platforms.forEach(p => {
            const dx = p.x - cameraX;
            ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(dx, p.y + 28, p.w, 6);
            const pg = ctx.createLinearGradient(0, p.y, 0, p.y + 28);
            pg.addColorStop(0, '#7d5a4a'); pg.addColorStop(0.5, '#5d3a2a'); pg.addColorStop(1, '#3e2317');
            ctx.fillStyle = pg; ctx.fillRect(dx, p.y, p.w, p.h); ctx.strokeStyle = '#2c1810'; ctx.lineWidth = 1; ctx.strokeRect(dx, p.y, p.w, p.h);
            const gg = ctx.createLinearGradient(0, p.y - 8, 0, p.y);
            gg.addColorStop(0, '#81c784'); gg.addColorStop(0.5, '#4caf50'); gg.addColorStop(1, '#2e7d32');
            ctx.fillStyle = gg; ctx.fillRect(dx, p.y - 8, p.w, 10);
            ctx.fillStyle = '#1b5e20';
            for (let i = 0; i < p.w; i += 8) { const h = 3 + Math.sin(i * 0.5) * 2; ctx.fillRect(dx + i, p.y - 8, 3, h); }
            ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(dx, p.y - 6, p.w, 3);
            ctx.fillStyle = '#2c1e14';
            for (let i = 0; i < p.w; i += 45) { ctx.fillRect(dx + i + 10, p.y + 4, 8, 5); ctx.fillStyle = '#4a3020'; ctx.fillRect(dx + i + 25, p.y + 10, 12, 4); ctx.fillStyle = '#2c1e14'; }
        });

        // Мёд и частицы
        objects.forEach(obj => {
            if (obj.collected && obj.sparkTimer <= 0) return;
            const dx = obj.x - cameraX, dy = obj.y + Math.sin(obj.bobPhase) * 5;
            ctx.save();
            if (obj.collected) { ctx.globalAlpha = obj.sparkTimer; ctx.scale(1.5 - obj.sparkTimer * 0.5, 1.5 - obj.sparkTimer * 0.5); }
            ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 14;
            ctx.font = 'bold 36px "Segoe UI Emoji", "Apple Color Emoji"'; ctx.textAlign = 'center';
            ctx.fillText('🍯', dx, dy); ctx.shadowBlur = 0; ctx.restore();
        });
        particles.filter(p => p.type === 'sparkle').forEach(p => {
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x - cameraX, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Медвежонок (детальный, без изменений)
        if (!invincible || Math.floor(Date.now() / 120) % 2 === 0) {
            const sx = bear.x - cameraX, sy = bear.y;
            ctx.save(); ctx.translate(sx + 35, sy + 40);
            // ... (полный код отрисовки медведя)
            ctx.restore();
        }
    }

    function drawSpruce(x, baseY, size) {
        ctx.save(); ctx.translate(x, baseY); ctx.scale(size, size);
        ctx.fillStyle = '#3e2317'; ctx.fillRect(-6, 0, 12, 50);
        ctx.fillStyle = '#1b5e20';
        ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(-25, -20); ctx.lineTo(25, -20); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, -45); ctx.lineTo(-30, 0); ctx.lineTo(30, 0); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(-22, 10); ctx.lineTo(22, 10); ctx.fill();
        ctx.restore();
    }

    // ... (функции jump, startGame, обработчики событий без изменений)
})();
</script>
