    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background: #0a1a0a;
            touch-action: manipulation;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        body {
            display: flex; justify-content: center; align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #gameContainer { position: relative; width: 100%; height: 100%; display: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
            right: max(20px, env(safe-area-inset-right));
            display: flex; justify-content: space-between;
            font-size: 20px; color: #fff;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
            font-weight: 600; z-index: 10; pointer-events: none;
        }
        #gameOver {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20,20,25,0.9); backdrop-filter: blur(20px);
            color: #fff; padding: 30px 40px; border-radius: 24px;
            text-align: center; font-size: 26px;
            display: none; flex-direction: column; gap: 20px;
            z-index: 20; max-width: 85vw;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        #gameOver.active { display: flex; }
        .btn {
            background: #ffd966; border: none; padding: 14px 30px;
            border-radius: 40px; font-weight: 700; font-size: 18px;
            color: #2d2d2d; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,215,0,0.3);
            transition: all 0.15s ease;
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        #splash1, #splash2 {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; pointer-events: none;
        }
        #splash1 { background: #0d0d15; opacity: 1; transition: opacity 0.6s ease; }
        #splash1.hidden { opacity: 0; }
        #splash1 .logo {
            font-size: 16px; font-weight: 500; letter-spacing: 4px;
            color: rgba(255,255,255,0.75); margin-bottom: 6px;
            animation: fadeInDown 0.8s ease; text-transform: uppercase;
        }
        #splash1 .sub {
            font-size: 11px; color: rgba(255,255,255,0.4);
            font-weight: 400; letter-spacing: 6px;
            animation: fadeInUp 0.8s ease; text-transform: uppercase;
        }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        #splash2 { background: #162816; opacity: 0; display: none; }
        #splash2.show { display: flex; opacity: 1; transition: opacity 0.6s ease; }
        #splash2 .title {
            font-size: 44px; font-weight: 800; color: #ffe9a7; letter-spacing: 1px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center; line-height: 1.15; padding: 0 20px;
            text-shadow: 0 2px 10px rgba(255,215,0,0.3);
        }
        @keyframes popIn { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Обучающие подсказки */
        #tutorial {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,215,0,0.5);
            border-radius: 20px;
            padding: 20px 30px;
            text-align: center;
            color: #ffe9a7;
            font-family: 'Fredoka One', 'Inter', sans-serif;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(255,215,0,0.4);
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #tutorial.hidden {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.95);
        }
        #tutorial .line {
            font-size: 22px;
            letter-spacing: 0.5px;
            margin: 4px 0;
            background: linear-gradient(180deg, #ffd700 0%, #ffb300 100%);

            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }
    </style>

<body>
<div id="splash1"><div class="logo">Made by</div><div class="sub">Nikita Kurbatov</div></div>
<div id="splash2"><div class="title">Медвежонок<br>Саня</div></div>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="tutorial">
        <div class="line">Тап — прыжок</div>
        <div class="line">Двойной тап — суперпрыжок</div>
    </div>
    <div id="ui"><span>🍯 <span id="scoreDisplay">0</span></span><span>❤️ <span id="livesDisplay">3</span></span></div>
    <div id="gameOver">
        <div style="font-size:28px;font-weight:700;">Игра окончена</div>
        <div style="font-size:18px;color:#ffe9a7;">Собрано мёда: <span id="finalScore" style="font-size:24px;font-weight:700;">0</span></div>
        <button class="btn" id="restartBtn">Играть снова</button>
    </div>
</div>

<script>
(function() {
    function fixHeight() {
        document.documentElement.style.height = window.innerHeight + 'px';
        document.body.style.height = window.innerHeight + 'px';
    }
    window.addEventListener('resize', fixHeight);
    window.addEventListener('orientationchange', () => setTimeout(fixHeight, 100));
    fixHeight();

    const splash1 = document.getElementById('splash1');
    const splash2 = document.getElementById('splash2');
    const gameContainer = document.getElementById('gameContainer');
    const tutorial = document.getElementById('tutorial');

    setTimeout(() => {
        splash1.classList.add('hidden');
        setTimeout(() => {
            splash1.style.display = 'none';
            splash2.classList.add('show');
            setTimeout(() => {
                splash2.style.opacity = '0';
                setTimeout(() => {
                    splash2.style.display = 'none';
                    gameContainer.style.display = 'block';
                    fixHeight();
                    requestAnimationFrame(() => {
                        startGame();
                        tutorial.classList.remove('hidden');
                        setTimeout(() => {
                            tutorial.classList.add('hidden');
                        }, 3500);
                    });
                }, 600);
            }, 2200);
        }, 600);
    }, 2800);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, groundLevel, dpr = Math.min(window.devicePixelRatio || 1, 2);
    let cameraX = 0, worldSpeed = 4.8, MAX_SPEED = 8.5;
    let score = 0, lives = 3, gameActive = false;
    let animationFrame, invincible = false, invincibleTimer = 0;
    let bearScreenX, lastTime = 0;
    const BEAR_W = 70, BEAR_H = 80;
    const GRAVITY = 0.9, BASE_JUMP = -16.5, SUPER_JUMP = -19.5;
    let bear = { worldX:0, worldY:0, vy:0, onGround:false, canDoubleJump:false, runFrame:0, squash:0 };
    let platforms=[], objects=[], particles=[], bgMountains=[], bgTrees=[];
    const GAPS = { small:[90,140], medium:[160,220], large:[250,320] };

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.width = window.innerWidth * dpr;
        H = canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        const style = getComputedStyle(document.body);
        const bottomSafe = parseFloat(style.paddingBottom) || 0;
        groundLevel = window.innerHeight - 85 - bottomSafe;
        bear.worldY = groundLevel - BEAR_H;
        bearScreenX = Math.min(60, window.innerWidth * 0.10);
    }
    window.addEventListener('resize', resize);

    function jump() {
        if (!gameActive) return;
        if (bear.onGround) {
            bear.vy = BASE_JUMP; bear.onGround = false; bear.canDoubleJump = true; bear.squash = 0.3;
        } else if (bear.canDoubleJump) {
            bear.vy = SUPER_JUMP; bear.canDoubleJump = false; bear.squash = 0.5;
            for (let i=0;i<8;i++) particles.push({ x: bear.worldX+BEAR_W/2, y: bear.worldY+BEAR_H, vx: (Math.random()-0.5)*4, vy: -Math.random()*3-2, life:1, decay:0.04, size:3+Math.random()*6, color: Math.random()<0.5?'#ffd700':'#ffaa00', type:'sparkle' });
        }
    }
    window.addEventListener('keydown', e => { if (e.code==='Space'||e.key===' ') { e.preventDefault(); jump(); } });
    canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });
    canvas.addEventListener('mousedown', e => jump());

    function generateWorld() {
        platforms=[]; objects=[]; particles=[]; bgMountains=[]; bgTrees=[];
        platforms.push({ x:0, y:groundLevel, w:window.innerWidth*3, h:28 });
        let lastX = window.innerWidth*3;
        for (let i=0; i<70; i++) {
            const w = 140+Math.random()*220;
            const hVar = Math.sin(i*0.5)*80+Math.cos(i*0.35)*50+(Math.random()-0.5)*50;
            let y = groundLevel+hVar;
            y = Math.max(groundLevel-170, Math.min(groundLevel+60, y));
            const r = Math.random(); let gap;
            if (r<0.5) gap = GAPS.small[0]+Math.random()*(GAPS.small[1]-GAPS.small[0]);
            else if (r<0.8) gap = GAPS.medium[0]+Math.random()*(GAPS.medium[1]-GAPS.medium[0]);
            else gap = GAPS.large[0]+Math.random()*(GAPS.large[1]-GAPS.large[0]);
            const newX = lastX+gap;
            platforms.push({ x:newX, y, w, h:28 });
            if (Math.random()<0.65) objects.push({ x:newX+w/2, y:y-80-Math.random()*70, collected:false, bobPhase:Math.random()*Math.PI*2, sparkTimer:0 });
            lastX = newX+w;
        }
        for (let i=0;i<15;i++) particles.push({ x:Math.random()*window.innerWidth*3, y:Math.random()*window.innerHeight*0.5, vx:0.2+Math.random()*0.4, size:40+Math.random()*60, alpha:0.25+Math.random()*0.4, type:'cloud' });
        for (let i=0;i<14;i++) bgMountains.push({ x:i*500, height:120+Math.sin(i)*60, width:280+Math.random()*200 });
        for (let i=0;i<35;i++) bgTrees.push({ x: Math.random()*window.innerWidth*3, y: groundLevel-20, size: 0.8+Math.random()*1.2 });
    }

    function update(delta) {
        if (!gameActive) return;
        const steps = Math.min(Math.ceil(delta/(1000/120)),5), step = delta/steps;
        for (let s=0; s<steps; s++) {
            bear.vy += GRAVITY*(step/16.67);
            bear.worldY += bear.vy*(step/16.67);
            bear.worldX = cameraX+bearScreenX;
            bear.squash *= 0.9;
            bear.onGround = false;
            for (const p of platforms) {
                if (bear.worldX+BEAR_W*0.3 < p.x+p.w && bear.worldX+BEAR_W*0.7 > p.x) {
                    if (bear.worldY+BEAR_H >= p.y && bear.worldY+BEAR_H <= p.y+28 && bear.vy >= 0) {
                        bear.worldY = p.y - BEAR_H; bear.vy = 0; bear.onGround = true; bear.canDoubleJump = false; if (s===0) bear.squash = 0.2;
                    }
                }
            }
            if (bear.worldY > window.innerHeight+300) { loseLife(); return; }
            cameraX += worldSpeed*(step/16.67);
            if (worldSpeed<MAX_SPEED) worldSpeed += 0.0003*(step/16.67);
            bear.worldX = cameraX+bearScreenX;
            const lastPlat = platforms[platforms.length-1];
            if (lastPlat && lastPlat.x+lastPlat.w < cameraX+window.innerWidth*5) {
                const i = platforms.length; const w = 140+Math.random()*220;
                const hVar = Math.sin(i*0.5)*80+Math.cos(i*0.35)*50+(Math.random()-0.5)*50;
                let y = groundLevel+hVar; y = Math.max(groundLevel-170, Math.min(groundLevel+60, y));
                const r = Math.random(); let gap;
                if (r<0.5) gap = GAPS.small[0]+Math.random()*(GAPS.small[1]-GAPS.small[0]);
                else if (r<0.8) gap = GAPS.medium[0]+Math.random()*(GAPS.medium[1]-GAPS.medium[0]);
                else gap = GAPS.large[0]+Math.random()*(GAPS.large[1]-GAPS.large[0]);
                const newX = lastPlat.x+lastPlat.w+gap; platforms.push({ x:newX, y, w, h:28 });
                if (Math.random()<0.65) objects.push({ x:newX+w/2, y:y-80-Math.random()*70, collected:false, bobPhase:Math.random()*Math.PI*2, sparkTimer:0 });
                while (platforms.length>50) platforms.shift(); while (objects.length>60) objects.shift();
            }
            for (const obj of objects) {
                if (obj.collected) continue;
                const dx = Math.abs(bear.worldX+BEAR_W/2-obj.x), dy = Math.abs(bear.worldY+BEAR_H/2-obj.y);
                if (dx<40 && dy<40 && !invincible) {
                    obj.collected = true; score += 25; document.getElementById('scoreDisplay').textContent = score; obj.sparkTimer = 1;
                    for (let j=0;j<6;j++) particles.push({ x:obj.x, y:obj.y, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3-1, life:1, decay:0.04, size:2+Math.random()*4, color:'#ffd700', type:'sparkle' });
                }
                obj.bobPhase += 0.05*(step/16.67);
            }
            objects = objects.filter(o => !o.collected || o.sparkTimer>0);
            objects.forEach(o => { if (o.sparkTimer>0) o.sparkTimer -= 0.02; });
            objects = objects.filter(o => !o.collected || o.sparkTimer>0);
            particles.forEach(p => { if (p.type==='cloud') { p.x -= p.vx; if (p.x<-200) p.x = window.innerWidth+300; } else { p.x += p.vx; p.y += p.vy; p.life -= p.decay; } });
            particles = particles.filter(p => p.type!=='sparkle' || p.life>0);
            if (invincible) { invincibleTimer--; if (invincibleTimer<=0) invincible = false; }
            if (bear.onGround) bear.runFrame += 0.25*(step/16.67);
        }
    }

    function loseLife() {
        lives--; document.getElementById('livesDisplay').textContent = lives;
        if (lives<=0) { gameActive = false; cancelAnimationFrame(animationFrame); document.getElementById('finalScore').textContent = score; document.getElementById('gameOver').classList.add('active'); return; }
        bear.worldY = groundLevel-BEAR_H; bear.vy = 0; bear.onGround = true; bear.canDoubleJump = false; invincible = true; invincibleTimer = 150;
        for (let i=0;i<15;i++) particles.push({ x:bear.worldX+BEAR_W/2, y:bear.worldY+BEAR_H/2, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6-2, life:1, decay:0.03, size:3+Math.random()*6, color:Math.random()<0.5?'#ff4444':'#ff8888', type:'sparkle' });
    }

    function drawSpruce(x,baseY,size) {
        ctx.save(); ctx.translate(x,baseY); ctx.scale(size,size);
        ctx.fillStyle='#2c1810'; ctx.fillRect(-5,0,10,50);
        ctx.fillStyle='#1b4a1b';
        ctx.beginPath(); ctx.moveTo(0,-60); ctx.lineTo(-22,-15); ctx.lineTo(22,-15); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0,-42); ctx.lineTo(-26,5); ctx.lineTo(26,5); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0,-25); ctx.lineTo(-20,18); ctx.lineTo(20,18); ctx.fill();
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
        const grad = ctx.createLinearGradient(0,0,0,window.innerHeight);
        grad.addColorStop(0,'#0a2a5e'); grad.addColorStop(0.35,'#3a6fb5'); grad.addColorStop(0.65,'#7ebce6'); grad.addColorStop(0.85,'#c1e1c1'); grad.addColorStop(1,'#5a8f3c');
        ctx.fillStyle=grad; ctx.fillRect(0,0,window.innerWidth,window.innerHeight);
        const sunX=window.innerWidth*0.85, sunY=window.innerHeight*0.2;
        const sunGlow = ctx.createRadialGradient(sunX,sunY,10,sunX,sunY,180);
        sunGlow.addColorStop(0,'rgba(255,255,200,1)'); sunGlow.addColorStop(0.3,'rgba(255,255,200,0.6)'); sunGlow.addColorStop(0.7,'rgba(255,200,100,0.1)'); sunGlow.addColorStop(1,'rgba(255,200,100,0)');
        ctx.fillStyle=sunGlow; ctx.beginPath(); ctx.arc(sunX,sunY,180,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fffde7'; ctx.beginPath(); ctx.arc(sunX,sunY,35,0,Math.PI*2); ctx.fill();
        bgMountains.forEach(m => { const x = (m.x-cameraX*0.1)%(window.innerWidth*2)-400; const mg = ctx.createLinearGradient(0,groundLevel-m.height,0,groundLevel+40); mg.addColorStop(0,'#5a7a4a'); mg.addColorStop(1,'#3a5a2a'); ctx.fillStyle=mg; ctx.beginPath(); ctx.moveTo(x-m.width/2,groundLevel+40); ctx.quadraticCurveTo(x,groundLevel-m.height,x+m.width/2,groundLevel+40); ctx.fill(); });
        bgTrees.forEach(t => { const x = (t.x-cameraX*0.3)%(window.innerWidth*2)-200; drawSpruce(x, groundLevel-20, t.size); });
        particles.filter(p=>p.type==='cloud').forEach(p => { ctx.fillStyle=`rgba(255,255,255,${p.alpha})`; ctx.beginPath(); const cx=p.x,cy=p.y,s=p.size; ctx.arc(cx,cy,s*0.55,0,Math.PI*2); ctx.arc(cx+s*0.4,cy-s*0.15,s*0.45,0,Math.PI*2); ctx.arc(cx+s*0.8,cy+s*0.05,s*0.5,0,Math.PI*2); ctx.arc(cx+s*0.3,cy-s*0.35,s*0.4,0,Math.PI*2); ctx.fill(); });
        platforms.forEach(p => { const dx=p.x-cameraX; ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(dx,p.y+28,p.w,6); const pg=ctx.createLinearGradient(0,p.y,0,p.y+28); pg.addColorStop(0,'#7d5a4a'); pg.addColorStop(0.5,'#5d3a2a'); pg.addColorStop(1,'#3e2317'); ctx.fillStyle=pg; ctx.fillRect(dx,p.y,p.w,p.h); ctx.strokeStyle='#2c1810'; ctx.lineWidth=1; ctx.strokeRect(dx,p.y,p.w,p.h); const gg=ctx.createLinearGradient(0,p.y-8,0,p.y); gg.addColorStop(0,'#81c784'); gg.addColorStop(0.5,'#4caf50'); gg.addColorStop(1,'#2e7d32'); ctx.fillStyle=gg; ctx.fillRect(dx,p.y-8,p.w,10); ctx.fillStyle='#1b5e20'; for (let i=0;i<p.w;i+=8){ const h=3+Math.sin(i*0.5)*2; ctx.fillRect(dx+i,p.y-8,3,h); } ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(dx,p.y-6,p.w,3); ctx.fillStyle='#2c1e14'; for (let i=0;i<p.w;i+=45){ ctx.fillRect(dx+i+10,p.y+4,8,5); ctx.fillStyle='#4a3020'; ctx.fillRect(dx+i+25,p.y+10,12,4); ctx.fillStyle='#2c1e14'; } });
        objects.forEach(obj => { if (obj.collected&&obj.sparkTimer<=0) return; const dx=obj.x-cameraX, dy=obj.y+Math.sin(obj.bobPhase)*5; ctx.save(); if(obj.collected){ ctx.globalAlpha=obj.sparkTimer; ctx.scale(1.5-obj.sparkTimer*0.5,1.5-obj.sparkTimer*0.5); } ctx.shadowColor='#ffd700'; ctx.shadowBlur=14; ctx.font='bold 36px "Segoe UI Emoji", "Apple Color Emoji"'; ctx.textAlign='center'; ctx.fillText('🍯',dx,dy); ctx.shadowBlur=0; ctx.restore(); });
        particles.filter(p=>p.type==='sparkle').forEach(p=>{ ctx.fillStyle=p.color; ctx.globalAlpha=p.life; ctx.beginPath(); ctx.arc(p.x-cameraX,p.y,p.size,0,Math.PI*2); ctx.fill(); });
        ctx.globalAlpha=1;
        if (!invincible||Math.floor(Date.now()/120)%2===0) drawBear();
    }

    function drawBear() {
        const sx=bear.worldX-cameraX, sy=bear.worldY;
        ctx.save(); ctx.translate(sx+BEAR_W/2, sy+BEAR_H/2); ctx.scale(1+bear.squash*0.3, 1-bear.squash*0.3);
        ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(2,38,24,5,0,0,Math.PI*2); ctx.fill();
        const bg=ctx.createLinearGradient(-28,-30,28,30); bg.addColorStop(0,'#e8b88a'); bg.addColorStop(0.4,'#c68c5c'); bg.addColorStop(1,'#8b5a3a');
        ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,2,28,32,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#5a321c'; ctx.lineWidth=2.5; ctx.stroke();
        ctx.fillStyle='#d4a373'; ctx.beginPath(); ctx.ellipse(0,8,18,20,0,0,Math.PI*2); ctx.fill();
        const hg=ctx.createRadialGradient(0,-36,5,0,-30,26); hg.addColorStop(0,'#f0c8a0'); hg.addColorStop(1,'#a06840');
        ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(0,-30,26,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#8b5a2b'; ctx.beginPath(); ctx.arc(-24,-48,12,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(24,-48,12,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#e0b090'; ctx.beginPath(); ctx.arc(-24,-48,6,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(24,-48,6,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#f5e6d3'; ctx.beginPath(); ctx.ellipse(0,-22,13,11,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#2c1e14'; ctx.beginPath(); ctx.ellipse(0,-25,4,3,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-12,-40,8,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(12,-40,8,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#2c1e14'; ctx.beginPath(); ctx.arc(-12,-40,4,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(12,-40,4,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-14,-42,2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(10,-42,2,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#4a2c14'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(-18,-48); ctx.quadraticCurveTo(-12,-51,-5,-48); ctx.stroke(); ctx.beginPath(); ctx.moveTo(5,-48); ctx.quadraticCurveTo(12,-51,18,-48); ctx.stroke();
        ctx.strokeStyle='#2c1e14'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,-16,8,0.3,Math.PI-0.3,false); ctx.stroke();

        const ls = Math.sin(bear.runFrame*Math.PI)*10;
        ctx.fillStyle='#7b4a2c'; ctx.strokeStyle='#5a321c'; ctx.lineWidth=2;

        ctx.restore();
    }

    function gameLoop(ts) {
        if (!lastTime) lastTime = ts;
        let dt = ts-lastTime; if (dt>100) dt=100;
        lastTime = ts; update(dt); draw();
        animationFrame = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        resize(); bear.worldY=groundLevel-BEAR_H; bear.vy=0; bear.onGround=true; bear.canDoubleJump=false; bear.runFrame=0; bear.squash=0;
        cameraX=0; worldSpeed=4.8; score=0; lives=3; invincible=false; invincibleTimer=0; lastTime=0;
        document.getElementById('scoreDisplay').textContent='0'; document.getElementById('livesDisplay').textContent='3';
        document.getElementById('gameOver').classList.remove('active'); generateWorld(); gameActive=true;
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(gameLoop);
    }

    document.getElementById('restartBtn').addEventListener('click', () => { document.getElementById('gameOver').classList.remove('active'); startGame(); });
    window.startGame = startGame;
})();
